{% extends 'base.html' %}
{% block content %}
<h1>Edit Feedback</h1>
<form method="post">
    <p>
        <label for="name">Name:</label>
        <input type="text" name="name" value="{{ feedback[1] }}" required>
    </p>
    <p>
        <label for="email">Email:</label>
        <input type="email" name="email" value="{{ feedback[2] }}" required>
    </p>
    <p>
        <label for="feedback">Feedback:</label>
        <select name="feedback" required>
            <option value="good" {% if feedback[3] == 'good' %}selected{% endif %}>Good</option>
            <option value="bad" {% if feedback[3] == 'bad' %}selected{% endif %}>Bad</option>
            <option value="very_good" {% if feedback[3] == 'very_good' %}selected{% endif %}>Very Good</option>
            <option value="very_bad" {% if feedback[3] == 'very_bad' %}selected{% endif %}>Very Bad</option>
        </select>
    </p>
    <p>
        <button type="submit">Save</button>
    </p>
</form>
{% endblock %}
