{% extends 'base.html' %}
{% block content %}
<h1>All Feedbacks</h1>
<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Feedback</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for feedback in feedbacks %}
        <tr>
            <td>{{ feedback[1] }}</td>
            <td>{{ feedback[2] }}</td>
            <td>{{ feedback[3] }}</td>
            <td>
                <a href="{{ url_for('edit_feedback', feedback_id=feedback[0]) }}">Edit</a>
                <form action="{{ url_for('delete_feedback', feedback_id=feedback[0]) }}" method="post" style="display:inline;">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
